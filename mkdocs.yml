site_name: OpenHUTB 文档模板
# 参考链接：https://blog.csdn.net/m0_63203517/article/details/129765689

#repo_url: https://github.com/carla-simulator/carla
#docs_dir: Docs
#edit_uri: 'edit/master/Docs/'


# 设置编译页面的链接的前缀
repo_url: https://github.com/OpenHUTB/template

# 页面右上角添加直接编辑页面的按钮
edit_uri: edit/master/docs/

theme:
  name: readthedocs
  sticky_navigation: True
  navigation_depth: 3
  features:
    - search.suggest # 在目录栏中的搜索框中输入一些字母时推荐补全整个单词
extra_css: [extra.css]



# mathjax用于单独公式展示
extra_javascript:
  # - extra.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/raphael/2.2.7/raphael.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.8.3/underscore-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/js-sequence-diagrams/1.0.6/sequence-diagram-min.js
  - https://cdnjs.cloudflare.com/ajax/libs/flowchart/1.6.5/flowchart.min.js
  - js/umlconvert.js

plugins:
#  - mkdocs-video
  - search:
      lang: ja
      separator: '[\s\-\.]+'
      min_search_length: 3
  - bibtex:
      bib_file: refs.bib
      csl_file: nature.csl
  - mkdocs-video:
      is_video: True
      video_autoplay: True
      video_loop: True
  - mermaid2

extra:
  generator: false

hooks:
  - hooks.py

copyright: OpenHUTB 版权所有 &copy; {year}


nav:
- 首页: 'index.md'
- mkdocs简介: 'mkdocs.md'

# - mdx_math 用于行内公式显示
markdown_extensions:
  - markdown_grid_tables
  - footnotes
  - admonition
  - mdx_math
  # MkDocs 默认的 slugify 会先把标题做 NFKD 归一化、再丢弃所有非 ASCII 字符，
  # 中文标题因此被清洗成空字符串，锚点退化成 _1、_2 这类无意义的占位符，
  # 导致全站中文标题的页内跳转（各页面顶部的「目录」）全部失效。
  # 改用 pymdown-extensions 自带的 Unicode 友好实现，保留中文锚点。
  # 依赖 pymdown-extensions 已在 requirements.txt 中，无需新增。
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid

